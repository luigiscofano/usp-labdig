name: Verificação digital
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simular:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python scripts/verificar.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python scripts/verificar_processing.py --classpath "$(python scripts/baixar_dependencias_processing.py)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-simulacao
          path: build/resultados.json
