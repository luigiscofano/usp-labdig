name: Verificação digital
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simular:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog xvfb xauth python3-tk
      - run: python scripts/verificar.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: xvfb-run -a python scripts/verificar_processing.py --grafico --classpath "$(python scripts/baixar_dependencias_processing.py)"
      - run: /usr/bin/python3 tests/test_gerador_quartus.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-simulacao
          path: |
            build/resultados.json
            build/processing/telas/*.png
            logs_*.csv
            snapshot_*.csv
